name: Tests

on:
  push:
    branches: [main, "portfolio/**"]
  pull_request:
  workflow_dispatch:

jobs:
  data-generator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas numpy pytest
      - name: Run data-generation tests
        run: python -m pytest tests/test_data_generation.py -q
